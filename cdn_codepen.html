rap;\n      gap: 1rem;\n    }\n\n    .sig {\n      font-family: &#39;Playfair Display&#39;, serif;\n      font-weight: 700;\n      font-size: 1.35rem;\n      letter-spacing: 0.08em;\n      color: var(--white);\n      display: flex;\n      align-items: center;\n      gap: 0.6rem;\n    }\n\n    .sig-dot {\n      width: 9px;\n      height: 9px;\n      border-radius: 50%;\n      background: var(--gold);\n      box-shadow: 0 0 12px var(--gold);\n    }\n\n    .social-pills {\n      display: flex;\n      align-items: center;\n      gap: 0.85rem;\n      flex-wrap: wrap;\n    }\n\n    .social-pill {\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      width: 44px;\n      height: 44px;\n      border-radius: 50%;\n      background: var(--white);\n      color: var(--navy-900);\n      text-decoration: none;\n      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);\n      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.25s;\n    }\n\n    .social-pill:hover {\n      transform: translateY(-3px) scale(1.08);\n      background: var(--off-white);\n    }\n\n    .social-pill svg {\n      width: 22px;\n      height: 22px;\n      flex-shrink: 0;\n    }\n\n    /* FREESTYLE EDITORIAL CANVAS */\n    .canvas {\n      max-width: 1220px;\n      margin: 0 auto;\n      padding: 3rem 2rem 6rem;\n      display: flex;\n      flex-direction: column;\n      gap: 6.5rem;\n    }\n\n    /* INTRO HEADER */\n    .editorial-head {\n      position: relative;\n      display: grid;\n      grid-template-columns: 1.1fr 0.9fr;\n      gap: 3rem;\n      align-items: center;\n    }\n\n    .kicker {\n      display: inline-block;\n      background: var(--white);\n      color: var(--navy-900);\n      font-weight: 700;\n      font-size: 0.78rem;\n      letter-spacing: 0.14em;\n      text-transform: uppercase;\n      padding: 0.4rem 0.95rem;\n      border-radius: 999px;\n      margin-bottom: 1.2rem;\n    }\n\n    .hero-title {\n      font-family: &#39;Playfair Display&#39;, serif;\n      font-size: clamp(3rem, 6vw, 5.2rem);\n      line-height: 1.05;\n      margin-bottom: 1.4rem;\n    }\n\n    .hero-title em {\n      font-style: italic;\n      color: var(--gold);\n      font-weight: 600;\n    }\n\n    .lead-box {\n      background: var(--white);\n      color: var(--navy-900);\n      padding: 1.8rem 2rem;\n      border-radius: 22px;\n      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);\n      transform: rotate(-1deg);\n      max-width: 540px;\n    }\n\n    .lead-box p {\n      font-size: 1.08rem;\n      font-weight: 500;\n    }\n\n    /* FREESTYLE INTERLEAVED BLOCKS */\n    .free-row {\n      display: grid;\n      grid-template-columns: repeat(12, 1fr);\n      align-items: center;\n      gap: 2rem;\n      position: relative;\n    }\n\n    .photo-frame {\n      position: relative;\n      border-radius: 24px;\n      padding: 12px;\n      background: var(--white);\n      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.45);\n      cursor: pointer;\n      transition: transform 0.35s ease;\n    }\n\n    .photo-frame:hover {\n      transform: translateY(-6px) rotate(0deg) !important;\n    }\n\n    .photo-frame img {\n      width: 100%;\n      height: auto;\n      border-radius: 16px;\n      display: block;\n    }\n\n    .photo-tag {\n      position: absolute;\n      bottom: -16px;\n      right: 24px;\n      background: var(--navy-950);\n      color: var(--white);\n      border: 2px solid var(--white);\n      padding: 0.45rem 1.1rem;\n      border-radius: 999px;\n      font-size: 0.8rem;\n      font-weight: 700;\n      letter-spacing: 0.06em;\n      text-transform: uppercase;\n    }\n\n    .story-card {\n      padding: 2.5rem;\n      border-radius: 26px;\n      position: relative;\n      z-index: 2;\n    }\n\n    .story-card.white-card {\n      background: var(--white);\n      color: var(--navy-900);\n      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.35);\n    }\n\n    .story-card.navy-card {\n      background: linear-gradient(145deg, var(--navy-800), var(--navy-950));\n      color: var(--white);\n      border: 1px solid rgba(255, 255, 255, 0.2);\n      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.45);\n    }\n\n    .story-num {\n      font-family: &#39;Playfair Display&#39;, serif;\n      font-size: 3.2rem;\n      line-height: 1;\n      opacity: 0.22;\n      margin-bottom: 0.5rem;\n      font-weight: 700;\n    }\n\n    .story-card h2 {\n      font-family: &#39;Playfair Display&#39;, serif;\n      font-size: clamp(1.75rem, 3vw, 2.4rem);\n      margin-bottom: 0.85rem;\n      line-height: 1.2;\n    }\n\n    .story-card p {\n      font-size: 1.02rem;\n      opacity: 0.9;\n    }\n\n    .chip-list {\n      display: flex;\n      flex-wrap: wrap;\n      gap: 0.6rem;\n      margin-top: 1.35rem;\n    }\n\n    .chip {\n      padding: 0.4rem 0.9rem;\n      border-radius: 999px;\n      font-size: 0.82rem;\n      font-weight: 700;\n      background: var(--navy-900);\n      color: var(--white);\n    }\n\n    .navy-card .chip {\n      background: var(--white);\n      color: var(--navy-900);\n    }\n\n    /* ASYMMETRIC PLACEMENTS */\n    .p-hero {\n      transform: rotate(2deg);\n    }\n\n    .b1-photo {\n      grid-column: 1 / 7;\n      transform: rotate(-2deg);\n    }\n    .b1-text {\n      grid-column: 6 / 13;\n      margin-top: 3rem;\n    }\n\n    .b2-text {\n      grid-column: 1 / 7;\n      transform: rotate(-1deg);\n    }\n    .b2-photo {\n      grid-column: 6 / 13;\n      transform: rotate(1.8deg);\n    }\n\n    .b3-photo {\n      grid-column: 2 / 7;\n      transform: rotate(1.5deg);\n    }\n    .b3-text {\n      grid-column: 7 / 13;\n      transform: translateY(-20px);\n    }\n\n    .b4-text {\n      grid-column: 1 / 6;\n    }\n    .b4-photo {\n      grid-column: 6 / 12;\n      transform: rotate(-1.8deg);\n    }\n\n    .lightbox {\n      position: fixed;\n      inset: 0;\n      background: rgba(5, 13, 26, 0.92);\n      display: none;\n      align-items: center;\n      justify-content: center;\n      z-index: 200;\n      padding: 2rem;\n    }\n\n    .lightbox.active {\n      display: flex;\n    }\n\n    .lightbox img {\n      max-width: 90vw;\n      max-height: 88vh;\n      border-radius: 16px;\n      border: 3px solid var(--white);\n    }\n\n    @media (max-width: 900px) {\n      .editorial-head {\n        grid-template-columns: 1fr;\n      }\n      .b1-photo, .b1-text,\n      .b2-text, .b2-photo,\n      .b3-photo, .b3-text,\n      .b4-text, .b4-photo {\n        grid-column: 1 / -1;\n        margin-top: 0;\n        transform: none;\n      }\n    }\n  </style>\n</head>\n<body>\n\n  <!-- TRANG C\u00c1 NH\u00c2N \u0110\u1eb6T L\u00caN \u0110\u1ea6U TI\u00caN -->\n  <header class=\"top-social-dock\">\n    <div class=\"top-social-inner\">\n      <div class=\"sig\">\n        <span class=\"sig-dot\"></span>\n        NGUY\u1ec4N MINH DUY\n      </div>\n\n      <div class=\"social-pills\">\n        <a class=\"social-pill\" href=\"https://web.facebook.com/nguyen.minh.duy.981778\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"Facebook\" title=\"Facebook\">\n          <svg viewBox=\"0 0 24 24\" fill=\"#1877F2\">\n            <path d=\"M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z\"/>\n          </svg>\n        </a>\n\n        <a class=\"social-pill\" href=\"https://www.instagram.com/_mduy.ng_/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"Instagram\" title=\"Instagram\">\n          <svg viewBox=\"0 0 24 24\" fill=\"#E4405F\">\n            <path d=\"M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 </strong> mang trong m\u00ecnh s\u1ef1 k\u1ebft h\u1ee3p gi\u1eefa t\u01b0 duy h\u1ecdc thu\u1eadt s\u1eafc b\u00e9n, ngo\u1ea1i h\u00ecnh \u0111i\u1ec3n trai, s\u1ef1 \u0111a t\u00e0i v\u00e0 m\u00e1u l\u1eeda c\u1ee7a m\u1ed9t <strong>Baller \u0111\u00edch th\u1ef1c</strong>.\n          </p>\n        </div>\n      </div>\n\n      <div class=\"photo-frame p-hero\" onclick=\"openLightbox(&#39;https://iili.io/ngGJTBI.jpg&#39;)\">\n        <img src=\"https://iili.io/ngGJTBI.jpg\" alt=\"Nguy\u1ec5n Minh Duy - R\u1eebng th\u00f4ng\" />\n        <span class=\"photo-tag\">01 / LHP Gentleman</span>\n      </div>\n    </section>\n\n    <!-- XEN K\u1ebc 2: \u1ea2NH BI\u1ec2N (PHOTO 2) + H\u1eccC GI\u1eceI & CHUY\u00caN LHP -->\n    <section class=\"free-row\">\n      <div class=\"photo-frame b1-photo\" onclick=\"openLightbox(&#39;https://iili.io/ngG9StV.jpg&#39;)\">\n        <img src=\"https://iili.io/ngG9StV.jpg\" alt=\"Minh Duy b\u00ean b\u1edd bi\u1ec3n\" />\n        <span class=\"photo-tag\">02 / Ocean Vibe</span>\n      </div>\n\n      <div class=\"story-card white-card b1-text\">\n        <div class=\"story-num\">01</div>\n        <h2>H\u1ecdc Sinh Chuy\u00ean L\u00ea H\u1ed3ng Phong \u2014 H\u1ecdc Gi\u1ecfi & B\u1ea3n L\u0129nh</h2>\n        <p>\n          Kho\u00e1c l\u00ean m\u00ecnh m\u00e0u \u00e1o c\u1ee7a ng\u00f4i tr\u01b0\u1eddng danh gi\u00e1 b\u1eadc nh\u1ea5t \u2014 <strong>THPT Chuy\u00ean L\u00ea H\u1ed3ng Phong</strong>, m\u00ecnh lu\u00f4n gi\u1eef k\u1ef7 lu\u1eadt, s\u1ef1 t\u1eadp trung v\u00e0 kh\u00e1t khao chinh ph\u1ee5c nh\u1eefng \u0111\u1ec9nh cao tri th\u1ee9c m\u1edbi m\u1ed7i ng\u00e0y.\n        </p>\n        <div class=\"chip-list\">\n          <span class=\"chip\">\ud83c\udf93 Chuy\u00ean L\u00ea H\u1ed3ng Phong</span>\n          <span class=\"chip\">\ud83d\udcda H\u1ecdc Gi\u1ecfi</span>\n          <span class=\"chip\">\ud83e\udde0 T\u01b0 Duy S\u1eafc B\u00e9n</span>\n        </div>\n      </div>\n    </section>\n\n    <!-- XEN K\u1ebc 3: \u0110\u1eb8P TRAI & PHONG C\u00c1CH + \u1ea2NH BAN \u0110\u00caM (PHOTO 3) -->\n    <section class=\"free-row\">\n      <div class=\"story-card navy-card b2-text\">\n        <div class=\"story-num\">02</div>\n        <h2>\u0110\u1eb9p Trai, L\u1ecbch L\u00e3m & Gu Th\u1ea9m M\u1ef9 Ri\u00eang</h2>\n        <p>\n          D\u00f9 l\u00e0 g\u00f3c nghi\u00eang d\u01b0\u1edbi \u00e1nh \u0111\u00e8n ph\u1ed1 th\u1ecb hay kho\u1ea3nh kh\u1eafc d\u1ea1o ch\u01a1i ph\u00f3ng kho\u00e1ng, s\u1ef1 ch\u1ec9n chu v\u00e0 th\u1ea7n th\u00e1i t\u1ef1 tin lu\u00f4n l\u00e0 d\u1ea5u \u1ea5n ri\u00eang kh\u00f4ng th\u1ec3 tr\u1ed9n l\u1eabn.\n        </p>\n        <div class=\"chip-list\">\n          <span class=\"chip\">\u2728 Visual Cu\u1ed1n H\u00fat</span>\n          <span class=\"chip\">\ud83d\udc54 Phong Th\u00e1i L\u1ecbch L\u00e3m</span>\n        </div>\n      </div>\n\n      <div class=\"photo-frame b2-photo\" onclick=\"openLightbox(&#39;https://iili.io/ngGHV5J.jpg&#39;)\">\n        <img src=\"https://iili.io/ngGHV5J.jpg\" alt=\"Minh Duy g\u00f3c nghi\u00eang bu\u1ed5i t\u1ed1i\" />\n        <span class=\"photo-tag\">03 / Night Aesthetic</span>\n      </div>\n    </section>\n\n    <!-- XEN K\u1ebc 4: \u1ea2NH R\u1eeaNG XANH (PHOTO 5) + \u0110A T\u00c0I -->\n    <section class=\"free-row\">\n      <div class=\"photo-frame b3-photo\" onclick=\"openLightbox(&#39;https://iili.io/ngGdIuj.jpg&#39;)\">\n        <img src=\"https://iili.io/ngGdIuj.jpg\" alt=\"Minh Duy gi\u1eefa thi\u00ean nhi\u00ean\" />\n        <span class=\"photo-tag\">04 / Freestyle Soul</span>\n      </div>\n\n      <div class=\"story-card white-card b3-text\">\n        <div class=\"story-num\">03</div>\n        <h2>\u0110a T\u00e0i & Lu\u00f4n B\u1ee9t Ph\u00e1 Gi\u1edbi H\u1ea1n</h2>\n        <p>\n          Kh\u00f4ng \u0111\u00f3ng khung b\u1ea3n th\u00e2n trong s\u00e1ch v\u1edf, m\u00ecnh y\u00eau th\u00edch kh\u00e1m ph\u00e1 nhi\u1ec1u l\u0129nh v\u1ef1c t\u1eeb ngh\u1ec7 thu\u1eadt nhi\u1ebfp \u1ea3nh, x\u00e2y d\u1ef1ng phong c\u00e1ch c\u00e1 nh\u00e2n \u0111\u1ebfn k\u1ebft n\u1ed1i c\u1ed9ng \u0111\u1ed3ng n\u0103ng \u0111\u1ed9ng.\n        </p>\n        <div class=\"chip-list\">\n          <span class=\"chip\">\u26a1 \u0110a T\u00e0i</span>\n          <span class=\"chip\">\ud83c\udfac S\u00e1ng T\u1ea1o</span>\n          <span class=\"chip\">\ud83c\udf1f N\u0103ng \u0110\u1ed9ng</span>\n        </div>\n      </div>\n    </section>\n\n    <!-- XEN K\u1ebc 5: BALLER \u0110\u00cdCH TH\u1ef0C + \u1ea2NH H\u00c0NH LANG (PHOTO 1) -->\n    <section class=\"free-row\">\n      <div class=\"story-card navy-card b4-text\">\n        <div class=\"story-num\">04</div>\n        <h2>M\u1ed9t Baller \u0110\u00edch Th\u1ef1c Tr\u00ean S\u00e2n B\u00f3ng</h2>\n        <p>\n          S\u00e2n b\u00f3ng r\u1ed5 l\u00e0 n\u01a1i ng\u1ecdn l\u1eeda \u0111am m\u00ea b\u00f9ng ch\u00e1y m\u1ea1nh m\u1ebd nh\u1ea5t. T\u1eebng pha d\u1eabn b\u00f3ng, t\u1eebng c\u00fa n\u00e9m r\u1ed5 chu\u1ea9n x\u00e1c v\u00e0 tinh th\u1ea7n chi\u1ebfn \u0111\u1ea5u h\u1ebft m\u00ecnh c\u00f9ng \u0111\u1ed3ng \u0111\u1ed9i ch\u00ednh l\u00e0 DNA c\u1ee7a m\u1ed9t <strong>True Baller</strong>.\n        </p>\n        <div class=\"chip-list\">\n          <span class=\"chip\">\ud83c\udfc0 True Baller</span>\n          <span class=\"chip\">\ud83d\udd25 Tinh Th\u1ea7n Chi\u1ebfn Binh</span>\n        </div>\n      </div>\n\n      <div class=\"photo-frame b4-photo\" onclick=\"openLightbox(&#39;https://iili.io/ngG9Tjp.jpg&#39;)\">\n        <img src=\"https://iili.io/ngG9Tjp.jpg\" alt=\"Minh Duy mood l\u1ea1nh l\u00f9ng\" />\n        <span class=\"photo-tag\">05 / Baller Mentality</span>\n      </div>\n    </section>\n\n  </main>\n\n  <div class=\"lightbox\" id=\"lightbox\" onclick=\"closeLightbox()\">\n    <img id=\"lightbox-img\" src=\"\" alt=\"Preview\" />\n  </div>\n\n  <script>\n    function openLightbox(src) {\n      document.getElementById(&#39;lightbox-img&#39;).src = src;\n      document.getElementById(&#39;lightbox&#39;).classList.add(&#39;active&#39;);\n    }\n    function closeLightbox() {\n      document.getElementById(&#39;lightbox&#39;).classList.remove(&#39;active&#39;);\n    }\n    document.addEventListener(&#39;keydown&#39;, (e) => {\n      if (e.key === &#39;Escape&#39;) closeLightbox();\n    });\n  </script>\n</body>\n</html>\n", "html_classes": "", "head": "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">"}' />
